
name: Deploy Laravel to MilesWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub Secrets
        env:
          SERVER_HOST: ${{ secrets.MILESWEB_HOST }}
          SERVER_USER: ${{ secrets.MILESWEB_USER }}
          SERVER_KEY: ${{ secrets.MILESWEB_SSH_KEY }}
          SERVER_PORT: ${{ secrets.MILESWEB_PORT }}
        run: |
          [ -n "$SERVER_HOST" ] && echo "HOST is set" || echo "HOST is MISSING"
          [ -n "$SERVER_USER" ] && echo "USER is set" || echo "USER is MISSING"
          [ -n "$SERVER_KEY" ] && echo "SSH KEY is set" || echo "SSH KEY is MISSING"
          [ -n "$SERVER_PORT" ] && echo "PORT is set" || echo "PORT is MISSING"

          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_KEY" ] || [ -z "$SERVER_PORT" ]; then
            echo "ERROR: One or more GitHub Secrets are missing."
            exit 1
          fi

      - name: Connect to MilesWeb and update code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MILESWEB_HOST }}
          username: ${{ secrets.MILESWEB_USER }}
          key: ${{ secrets.MILESWEB_SSH_KEY }}
          port: ${{ secrets.MILESWEB_PORT }}
          script: |
            set -e
            cd ~/mickey.dawebsolutions.com
            git fetch origin main
            git reset --hard origin/main
            php artisan view:clear
            php artisan config:clear
            echo "Deployment completed successfully"
